<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Full Form & Modals</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex relative">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-slate-800/90 border-r border-slate-700/60 flex flex-col justify-between shrink-0">
        <div>
            <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-700/60">
                <div class="p-2 bg-indigo-600/20 border border-indigo-500/30 rounded-lg text-indigo-400">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-lg text-white">Admin Control</span>
            </div>
            <nav class="p-4 space-y-1">
                <a href="#categories"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 font-medium text-sm">
                    <i data-lucide="folder" class="w-4 h-4"></i>
                    <span>Quản lý Danh mục</span>
                </a>
                <a href="#products"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-700/40 font-medium text-sm transition">
                    <i data-lucide="package" class="w-4 h-4"></i>
                    <span>Quản lý Sản phẩm</span>
                </a>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 p-8 overflow-y-auto space-y-8">

        <!-- TOP HEADER -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">Quản lý Hệ thống</h1>
                <p class="text-xs text-slate-400 mt-1">Danh mục sản phẩm và danh sách hàng hóa</p>
            </div>

            <!-- Action Buttons Trigger Modals -->
            <div class="flex items-center gap-3">
                <button onclick="openCategoryModal()"
                    class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl text-sm font-medium transition">
                    <i data-lucide="folder-plus" class="w-4 h-4 text-indigo-400"></i>
                    <span>+ Thêm Danh mục</span>
                </button>
                <button onclick="openProductModal()"
                    class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>+ Thêm Sản phẩm</span>
                </button>
            </div>
        </header>

        <!-- TABLE QUẢN LÝ DANH MỤC -->
        <section id="categories"
            class="bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-5 border-b border-slate-700/60 flex items-center justify-between">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="folder" class="w-5 h-5 text-indigo-400"></i> Danh Sách Danh Mục
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead
                        class="bg-slate-900/50 text-slate-400 uppercase text-[11px] font-semibold border-b border-slate-700/60">
                        <tr>
                            <th class="px-6 py-3.5">ID</th>
                            <th class="px-6 py-3.5">Tên Danh Mục</th>
                            <th class="px-6 py-3.5">Trạng Thái</th>
                            <th class="px-6 py-3.5 text-right">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="categoryTableBody" class="divide-y divide-slate-700/40">
                        <!-- Render JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- TABLE QUẢN LÝ SẢN PHẨM -->
        <section id="products" class="bg-slate-800/80 border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-5 border-b border-slate-700/60 flex items-center justify-between">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="package" class="w-5 h-5 text-indigo-400"></i> Danh Sách Sản Phẩm
                </h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead
                        class="bg-slate-900/50 text-slate-400 uppercase text-[11px] font-semibold border-b border-slate-700/60">
                        <tr>
                            <th class="px-6 py-3.5">Sản Phẩm</th>
                            <th class="px-6 py-3.5">Danh Mục</th>
                            <th class="px-6 py-3.5">Giá Bán</th>
                            <th class="px-6 py-3.5">Trạng Thái</th>
                            <th class="px-6 py-3.5 text-right">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-slate-700/40">
                        <!-- Render JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- ==================== MODAL DANH MỤC (Thêm / Sửa) ==================== -->
    <div id="categoryModal"
        class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all">

            <div class="px-6 py-4 border-b border-slate-700/60 flex items-center justify-between">
                <h3 id="categoryModalTitle" class="text-base font-bold text-white">Thêm Danh Mục</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="categoryForm" onsubmit="saveCategory(event)" class="p-6 space-y-4">
                <input name="input_id" type="hidden" id="catId">

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Tên Danh Mục</label>
                    <input name="input_title" type="text" id="catTitle" required placeholder="Nhập tên danh mục..."
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <input name="input_status" type="checkbox" id="catStatus" checked
                        class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500/50">
                    <label for="catStatus" class="text-xs text-slate-300 cursor-pointer">Hoạt động (Cho phép hiển
                        thị)</label>
                </div>

                <div class="flex justify-end gap-2.5 pt-4 border-t border-slate-700/60">
                    <button type="button" onclick="closeCategoryModal()"
                        class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium transition">Hủy</button>
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition">
                        Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== MODAL SẢN PHẨM (Thêm / Sửa) ==================== -->
    <div id="productModal"
        class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden transform transition-all">

            <div class="px-6 py-4 border-b border-slate-700/60 flex items-center justify-between">
                <h3 id="productModalTitle" class="text-base font-bold text-white">Thêm Sản Phẩm</h3>
                <button onclick="closeProductModal()" class="text-slate-400 hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="productForm" onsubmit="saveProduct(event)" class="p-6 space-y-4">
                <input type="hidden" id="prodId">

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Tên Sản Phẩm</label>
                    <input type="text" id="prodName" required placeholder="Nhập tên sản phẩm..."
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Giá Bán (VNĐ)</label>
                        <input type="number" id="prodPrice" required min="0" placeholder="0"
                            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Danh Mục</label>
                        <select id="prodCategoryId" required
                            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            <!-- Options render dynamically -->
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Đường dẫn Hình Ảnh (URL)</label>
                    <input type="url" id="prodImage" required placeholder="https://example.com/image.png"
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <input type="checkbox" id="prodStatus" checked
                        class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500/50">
                    <label for="prodStatus" class="text-xs text-slate-300 cursor-pointer">Đang bán (Trạng thái hoạt
                        động)</label>
                </div>

                <div class="flex justify-end gap-2.5 pt-4 border-t border-slate-700/60">
                    <button type="button" onclick="closeProductModal()"
                        class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-medium transition">Hủy</button>
                    <button type="submit"
                        class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition">Lưu
                        Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>


    <script src="../data.js"></script>
    <script src="./dashboard.js"></script>


    <!-- LOGIC XỬ LÝ JS -->
    <script>


        /* ---------------- SẢN PHẨM LOGIC ---------------- */
        function renderProducts() {
            const tbody = document.getElementById("productTableBody");
            tbody.innerHTML = productList.map(prod => {
                const cat = categoryList.find(c => c.id === prod.categoryId);
                return `
          <tr class="hover:bg-slate-700/20 transition">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 p-1 flex items-center justify-center shrink-0 overflow-hidden">
                  <img src="${prod.images[0] || ''}" alt="${prod.name}" class="object-contain w-full h-full" />
                </div>
                <div>
                  <span class="font-semibold text-white block">${prod.name}</span>
                  <span class="text-xs text-slate-500 font-mono">ID: #${prod.id}</span>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-700/50 text-slate-300 border border-slate-600/40">
                ${cat ? cat.title : 'N/A'}
              </span>
            </td>
            <td class="px-6 py-4 font-semibold text-indigo-400">
              ${Number(prod.price).toLocaleString('vi-VN')} <span class="text-xs text-slate-400 font-normal">VNĐ</span>
            </td>
            <td class="px-6 py-4">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${prod.status ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}">
                <span class="w-1.5 h-1.5 rounded-full ${prod.status ? 'bg-emerald-400' : 'bg-rose-400'}"></span> ${prod.status ? 'Đang bán' : 'Ẩn'}
              </span>
            </td>
            <td class="px-6 py-4 text-right">
              <button onclick="openProductModal(${prod.id})" class="p-1.5 bg-slate-700/60 hover:bg-indigo-600/30 text-slate-300 hover:text-indigo-400 rounded-lg transition border border-slate-600/40 mr-1">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteProduct(${prod.id})" class="p-1.5 bg-slate-700/60 hover:bg-rose-600/30 text-slate-300 hover:text-rose-400 rounded-lg transition border border-slate-600/40">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>
        `;
            }).join('');
            lucide.createIcons();
        }

        function populateCategoryOptions(selectedCatId = null) {
            const select = document.getElementById("prodCategoryId");
            select.innerHTML = categoryList.map(c => `
        <option value="${c.id}" ${c.id == selectedCatId ? 'selected' : ''}>${c.title}</option>
      `).join('');
        }

        function openProductModal(id = null) {
            const modal = document.getElementById("productModal");
            const title = document.getElementById("productModalTitle");

            populateCategoryOptions();

            if (id) {
                const prod = productList.find(p => p.id === id);
                title.innerText = "Sửa Sản Phẩm";
                document.getElementById("prodId").value = prod.id;
                document.getElementById("prodName").value = prod.name;
                document.getElementById("prodPrice").value = prod.price;
                document.getElementById("prodCategoryId").value = prod.categoryId;
                document.getElementById("prodImage").value = prod.images[0] || '';
                document.getElementById("prodStatus").checked = prod.status;
            } else {
                title.innerText = "Thêm Sản Phẩm";
                document.getElementById("productForm").reset();
                document.getElementById("prodId").value = "";
            }
            modal.classList.remove("hidden");
        }

        function closeProductModal() {
            document.getElementById("productModal").classList.add("hidden");
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById("prodId").value;
            const name = document.getElementById("prodName").value.trim();
            const price = Number(document.getElementById("prodPrice").value);
            const categoryId = Number(document.getElementById("prodCategoryId").value);
            const imageUrl = document.getElementById("prodImage").value.trim();
            const status = document.getElementById("prodStatus").checked;

            if (id) {
                // Edit
                const prod = productList.find(p => p.id == id);
                if (prod) {
                    prod.name = name;
                    prod.price = price;
                    prod.categoryId = categoryId;
                    prod.images = [imageUrl];
                    prod.status = status;
                }
            } else {
                // Add
                const newProduct = {
                    id: productList.length ? Math.max(...productList.map(p => p.id)) + 1 : 1,
                    name,
                    price,
                    categoryId,
                    status,
                    images: [imageUrl]
                };
                productList.push(newProduct);
            }

            closeProductModal();
            renderProducts();
        }

        function deleteProduct(id) {
            if (confirm("Xác nhận xóa sản phẩm này?")) {
                productList = productList.filter(p => p.id !== id);
                renderProducts();
            }
        }
    </script>



</body>

</html>
