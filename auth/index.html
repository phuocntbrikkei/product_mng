<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Hệ thống Quản trị</title>
    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div
        class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/50 overflow-hidden">

        <!-- Header -->
        <div class="p-8 pb-6 text-center border-b border-slate-700/50">
            <div
                class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-indigo-600/20 text-indigo-400 mb-4 border border-indigo-500/30">
                <i data-lucide="shield-check" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Admin Dashboard</h1>
            <p class="text-xs text-slate-400 mt-1">Đăng nhập tài khoản Quản trị viên / Moderator</p>
        </div>

        <!-- Alert Box (Thống báo lỗi / Trạng thái) -->
        <div id="alertBox" class="hidden mx-8 mt-6 p-3.5 rounded-xl text-xs font-medium flex items-center gap-2.5">
            <i id="alertIcon" class="w-4 h-4 shrink-0"></i>
            <span id="alertMessage"></span>
        </div>

        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="p-8 space-y-5">

            <!-- Username Input -->
            <div>
                <label for="username" class="block text-xs font-medium text-slate-300 mb-1.5">Tên đăng nhập</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <input type="text" id="username" required placeholder="Nhập username"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm text-slate-100 placeholder-slate-500 outline-none transition" />
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Mật khẩu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-10 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm text-slate-100 placeholder-slate-500 outline-none transition" />
                    <button type="button" onclick="togglePassword()"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition">
                        <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Extra Options -->
            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center gap-2 cursor-pointer text-slate-400 hover:text-slate-300">
                    <input type="checkbox"
                        class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500/50" />
                    <span>Ghi nhớ đăng nhập</span>
                </label>
                <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium">Quên mật khẩu?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium rounded-xl text-sm transition shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2">
                <span>Đăng nhập</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Footer -->
        <div class="px-8 py-4 bg-slate-900/40 border-t border-slate-700/40 text-center text-xs text-slate-500">
            Hệ thống quản trị nội bộ &bull; Secure SSL 256-bit
        </div>

    </div>

    <script src="../data.js"></script>
    <script src="auth.js"></script>
</body>

</html>
